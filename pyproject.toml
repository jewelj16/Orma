[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orma"
version = "0.1.0"
description = "Local, daemonized file-versioning system — remembers every save of every tracked file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Orma Contributors" },
]
keywords = ["versioning", "file-history", "backup", "daemon"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "click>=8.1",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
delta = [
    "bsdiff4>=1.2",
]

[project.scripts]
orma = "orma.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
